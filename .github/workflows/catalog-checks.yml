name: Catalog checks

# README.md is generated from the category files by scripts/build-readme.py.
# This job regenerates it and fails if the result differs from what is committed,
# so a hand-edited README or a forgotten regeneration is caught in review rather
# than silently reverted by the next person who runs the script.

on:
  pull_request:
    paths:
      - "categories/**"
      - "scripts/build-readme.py"
      - "tags.json"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/audit-tags.py"
      - "scripts/jev-ray.py"
      - "scripts/tests/**"
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot appear in a step `if`, so expose only whether one is set.
      # Pull requests from forks never receive secrets, and the scan step skips.
      HAS_JEV_KEY: ${{ secrets.TYPESAFE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # jev-ray compares the branch with its base to find submitted entries.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate README
        run: |
          set -o pipefail
          python3 scripts/build-readme.py 2>&1 | tee build.log

      - name: Fail on unknown tags
        run: |
          if grep -q "unknown tag" build.log; then
            echo "::error::A category file uses a tag value that is not in the vocabulary."
            echo "The generator drops unknown tags, so the badge would silently go missing."
            grep "unknown tag" build.log
            exit 1
          fi

      - name: Fail on drift
        run: |
          # CONTRIBUTING.md is only rewritten once the vocabulary table is
          # generated; until then this simply never differs.
          if ! git diff --quiet -- README.md CONTRIBUTING.md; then
            echo "::error::A generated file does not match its sources."
            echo "Edit the category file or tags.json, then run:"
            echo "  python3 scripts/build-readme.py"
            echo "and commit the regenerated files."
            git diff -- README.md CONTRIBUTING.md
            exit 1
          fi
          echo "Generated files are in sync with their sources."

      - name: Audit tags against entry text
        run: python3 scripts/audit-tags.py categories

      - name: Test jev-ray (offline)
        run: python3 -m unittest discover -s scripts/tests

      # Asks Jev about the repositories of entries this pull request adds or edits
      # and reports, as annotations on the diff, tags it would add and hand tags
      # it disagrees with. It never fails the job and never edits a file: the
      # hand tag wins, and the disagreement is for the reviewer to read (#154).
      - name: Scan submitted entries with jev-ray
        if: github.event_name == 'pull_request' && env.HAS_JEV_KEY == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/jev-ray.py check --changed-since "origin/${{ github.base_ref }}" --no-cache
